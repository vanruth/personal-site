# Netlify configuration, kept in version control rather than in dashboard
# settings you'd otherwise have to remember.

[build]
  # No build step — this is plain HTML/CSS, served exactly as committed.
  # The matching fields in the Netlify UI must be left empty / set to "." too.
  publish = "."

[build.processing]
  skip_processing = false

[build.processing.html]
  # Serve /about instead of /about.html, and redirect the .html URL to the
  # clean one, so each page has exactly one canonical address.
  pretty_urls = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# Static assets are safe to cache hard. If you change style.css and the browser
# seems stuck on the old one, rename the file (style.v2.css) to bust the cache.
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
